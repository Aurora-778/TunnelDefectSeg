tasks:
  engineering_report:
    agent: engineering_report
    deps: []
    retries: 2
    cache: false

  growth_analysis:
    agent: growth_analysis
    deps: [engineering_report]
    retries: 2
    cache: false

  memory:
    agent: memory
    deps: [growth_analysis]
    retries: 2
    cache: false

  association:
    agent: association
    deps: [growth_analysis]
    retries: 2
    cache: false

  visualization:
    agent: visualization
    deps: [growth_analysis, association]
    retries: 2
    cache: false

  final_report:
    agent: final_report
    deps: [memory, association, visualization]
    retries: 2
    cache: false

  phase_a_association:
    agent: association
    deps: []
    retries: 0
    cache: false

  phase_a_comparison_evidence:
    agent: comparison_evidence
    deps: [phase_a_association]
    retries: 0
    cache: false

  phase_a_claim_gate:
    agent: claim_gate
    deps: [phase_a_comparison_evidence]
    retries: 0
    cache: false

  phase_a_growth_report:
    agent: growth_report
    deps: [phase_a_claim_gate]
    retries: 0
    cache: false

  phase_a_memory_report:
    agent: memory_report
    deps: [phase_a_claim_gate]
    retries: 0
    cache: false

  phase_a_engineering_claim_report:
    agent: engineering_claim_report
    deps: [phase_a_claim_gate]
    retries: 0
    cache: false

  phase_a_claim_visualization:
    agent: claim_visualization
    deps: [phase_a_claim_gate, phase_a_growth_report, phase_a_memory_report, phase_a_engineering_claim_report]
    retries: 0
    cache: false

execution_profiles:
  legacy_default:
    terminal_tasks: [final_report]
  phase_a_agent_sandbox:
    terminal_tasks: [phase_a_claim_visualization]

shared:
  project_name: tunnel_robot_inspection

inputs:
  engineering_report:
    frame_records: data/simulated/robot_kict_frame_records.csv
    output_path: data/simulated/disease_engineering_report.csv
    markdown_path: outputs/disease_engineering_report.md
    summary_path: outputs/disease_engineering_report_summary.md

  growth_analysis:
    engineering_report: data/simulated/disease_engineering_report.csv
    output_path: data/simulated/disease_growth_results.csv
    legacy_output_path: data/simulated/disease_growth_analysis.csv
    markdown_path: outputs/disease_growth_analysis_report.md
    summary_path: outputs/disease_growth_analysis_summary.md

  memory:
    engineering_report: data/simulated/disease_engineering_report.csv
    growth_analysis: data/simulated/disease_growth_results.csv
    output_path: data/simulated/disease_memory_bank.csv
    report_path: outputs/memory_agent_report.md
    summary_path: outputs/disease_memory_bank_summary.md
    log_path: logs/memory_agent.log

  association:
    frame_records: data/simulated/robot_kict_frame_records.csv
    output_path: data/simulated/disease_association_records.csv
    legacy_output_path: data/simulated/association_records.csv
    history_only: true
    history_output_dir: data/simulated/main_progressive
    manifest_path: data/simulated/main_progressive/association_manifest.json
    use_disease_id_score: false
    association_mode: no_id

  visualization:
    engineering_report: data/simulated/disease_engineering_report.csv
    growth_results: data/simulated/disease_growth_results.csv
    association_records: data/simulated/disease_association_records.csv
    recheck_list: data/simulated/priority_recheck_list.csv
    visualization_dir: outputs/visualizations
    visualization_report: outputs/visualization_report.md
    recheck_report: outputs/recheck_list_report.md
    visualization_summary: outputs/visualization_summary.md
    association_graph: outputs/visualizations/association_relationship_graph.png

  final_report:
    engineering_report: data/simulated/disease_engineering_report.csv
    growth_results: data/simulated/disease_growth_results.csv
    memory_bank: data/simulated/disease_memory_bank.csv
    association_records: data/simulated/disease_association_records.csv
    recheck_list: data/simulated/priority_recheck_list.csv
    visualization_dir: outputs/visualizations
    final_report: outputs/final_project_report.md
    system_summary: outputs/system_summary.md
    key_insights: outputs/key_insights.md
