pipeline:
  - memory
  - association
  - web
  - doc

goals:
  memory:
    depends_on: []
  association:
    depends_on: [memory]
  web:
    depends_on: [association]
  doc:
    depends_on: [web]

shared:
  project_name: tunnel_robot_inspection

inputs:
  memory:
    engineering_report: data/simulated/disease_engineering_report.csv
    growth_analysis: data/simulated/disease_growth_analysis.csv
    output_path: data/simulated/disease_memory_bank.csv
    report_path: outputs/memory_agent_report.md
    summary_path: outputs/disease_memory_bank_summary.md
    log_path: logs/memory_agent.log
  association:
    frame_records: data/simulated/robot_kict_frame_records.csv
    output_path: data/simulated/association_records.csv
  web:
    manifest_path: outputs/orchestrator_web_manifest.md
  doc:
    summary_path: outputs/orchestrator_v1_summary.md
    docs_path: docs/orchestrator_v1_summary.md
