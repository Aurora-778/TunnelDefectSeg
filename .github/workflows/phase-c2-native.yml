name: phase-c2-c3-windows-native

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-phase-c.txt
      - name: Run Phase C-2/C-3 Windows acceptance
        run: python -m pytest --rootdir . tests/test_inspection_review_admission.py tests/test_inspection_review_commit.py -q -p no:cacheprovider
      - name: Require every Windows-native Phase C-2 test
        run: python -m pytest --rootdir . tests/test_inspection_review_admission.py -k native_windows -q -p no:cacheprovider
