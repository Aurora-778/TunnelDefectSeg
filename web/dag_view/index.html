<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAG 可视化</title>
  <style>
    body { margin: 0; background: #0d1719; color: #10202b; font-family: Arial, "Microsoft YaHei", sans-serif; }
    .shell { max-width: 1180px; margin: 28px auto; background: #f4f8fb; border: 1px solid #1d3440; padding: 24px; }
    a { color: #006f77; font-weight: 700; text-decoration: none; margin-right: 14px; }
    h1 { margin: 16px 0 8px; font-size: 32px; }
    .canvas { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
    .panel { border: 1px solid #9eb0ba; background: #fff; padding: 16px; }
    .node { border: 1px solid #22323c; padding: 12px; margin-bottom: 10px; background: #eef5f7; }
    .success { border-left: 8px solid #009b8e; }
    .failed { border-left: 8px solid #cc3b3b; }
    .running { border-left: 8px solid #d89400; }
    pre { white-space: pre-wrap; background: #0b1418; color: #cceff1; padding: 14px; overflow: auto; }
  </style>
</head>
<body>
  <div class="shell">
    <nav>
      <a href="/web/dashboard/index.html">Dashboard</a>
      <a href="/web/dag_view/index.html">DAG 可视化</a>
      <a href="/web/run_compare/index.html">Run 对比</a>
    </nav>
    <h1>DAG 可视化</h1>
    <p>展示当前 run 的任务节点、依赖边和执行状态。</p>
    <div class="canvas">
      <section class="panel"><h2>Nodes</h2><div id="nodes"></div></section>
      <section class="panel"><h2>Edges</h2><pre id="edges">[]</pre></section>
    </div>
  </div>
  <script>
    fetch('/api/dag').then(r => r.json()).then(data => {
      document.getElementById('nodes').innerHTML = (data.nodes || []).map(node =>
        `<div class="node ${node.status || ''}"><strong>${node.id}</strong><br>agent: ${node.agent}<br>status: ${node.status || 'pending'}</div>`
      ).join('');
      document.getElementById('edges').textContent = JSON.stringify(data.edges || [], null, 2);
    });
  </script>
</body>
</html>
