version: '1.0'
name: phase-c2-linux-native
displayName: Phase C-2 Linux x86-64 native acceptance
stages:
  - stage:
    name: phase-c2-native
    displayName: Linux x86-64 native
    steps:
      - step: build@python
        name: phase-c2-linux-x86-64
        displayName: Phase C-2 pytest (Linux x86-64)
        pythonVersion: '3.11'
        artifacts:
          - name: PHASE_C2_NATIVE_LOGS
            path:
              - ./ci-artifacts
        commands:
          - mkdir -p ci-artifacts
          - echo "PHASE_C2_BASELINE=f385cac63549f5453fbf1a5ad698285f9f6cc972" | tee ci-artifacts/phase-c2-identity.log
          - echo "GIT_COMMIT=$(git rev-parse HEAD)" | tee -a ci-artifacts/phase-c2-identity.log
          - echo "ARCH=$(uname -m)" | tee -a ci-artifacts/phase-c2-identity.log
          - test "$(uname -m)" = "x86_64"
          - git fetch --no-tags --depth=50 origin main
          - git merge-base --is-ancestor f385cac63549f5453fbf1a5ad698285f9f6cc972 HEAD
          - python3 -m pip install -r requirements-phase-c.txt
          - mkdir -p /dev/shm/phase-c2-nodev
          - findmnt -no OPTIONS /dev/shm | tee ci-artifacts/phase-c2-nodev-mount.log
          - findmnt -no OPTIONS /dev/shm | grep -Eq '(^|,)nodev(,|$)'
          - PHASE_C2_NODEV_ROOT=/dev/shm/phase-c2-nodev python3 -m pytest --rootdir . tests/test_inspection_review_admission.py -q -p no:cacheprovider | tee ci-artifacts/phase-c2-full.log
          - PHASE_C2_NODEV_ROOT=/dev/shm/phase-c2-nodev python3 -m pytest --rootdir . tests/test_inspection_review_admission.py -k native_linux -q -p no:cacheprovider | tee ci-artifacts/phase-c2-linux-native.log
      - step: publish@general_artifacts
        name: publish-phase-c2-native-logs
        displayName: Preserve SHA and pytest logs
        dependArtifact: PHASE_C2_NATIVE_LOGS
        artifactRepository: default
        artifactName: phase-c2-linux-native-logs
        dependsOn: phase-c2-linux-x86-64
triggers:
  push:
    branches:
      include:
        - main
